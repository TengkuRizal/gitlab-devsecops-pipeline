stages:
  - validate
  - secret-scan
  - sast
  - config-scan
  - build-image
  - sbom
  - image-scan
  - deploy
  - verify

variables:
  NAMESPACE: "demo"
  APP_NAME: "demo-nginx"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/demo-nginx:$CI_COMMIT_SHORT_SHA"

validate-manifests:
  stage: validate
  script:
    - echo "Validating Kubernetes manifests"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - kubectl apply --dry-run=client -f k8s/ 2>&1 | tee validate-report.txt
    - echo "Manifest validation complete"
  artifacts:
    when: always
    paths:
      - validate-report.txt
    expire_in: 7 days
  only:
    - main

gitleaks-scan:
  stage: secret-scan
  script:
    - echo "Scanning for secrets with Gitleaks"
    - gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days
  allow_failure: false
  only:
    - main

semgrep-sast:
  stage: sast
  script:
    - echo "Running Semgrep SAST"
    - /home/runner/.local/bin/semgrep scan --config=auto --json --output semgrep-report.json . || true
    - echo "Semgrep scan complete"
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 7 days
  allow_failure: false
  only:
    - main

k8s_config_scan:
  stage: config-scan
  script:
    - echo "Scanning K8s manifests with Trivy"
    - trivy config --skip-version-check --format json --output trivy-k8s-config-report.json k8s/
  artifacts:
    when: always
    paths:
      - trivy-k8s-config-report.json
    expire_in: 1 week
  only:
    - main

build-image:
  stage: build-image
  script:
    - echo "Building and pushing Docker image"
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - test -n "$CI_REGISTRY" || (echo "CI_REGISTRY is empty." && exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
  only:
    - main

generate-sbom:
  stage: sbom
  script:
    - echo "Generating SBOM with Syft"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - syft "$IMAGE_NAME" -o cyclonedx-json=sbom-cyclonedx.json
  artifacts:
    when: always
    paths:
      - sbom-cyclonedx.json
    expire_in: 7 days
  only:
    - main

trivy_image_scan:
  stage: image-scan
  script:
    - echo "Scanning container image with Trivy"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - trivy image --skip-version-check --skip-java-db-update --severity HIGH,CRITICAL --format json --output trivy-image-report.json "$IMAGE_NAME"
  artifacts:
    when: always
    paths:
      - trivy-image-report.json
    expire_in: 1 week
  allow_failure: false
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "GitOps Deploy - Updating image tag in Git"
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - echo "New image tag $IMAGE_TAG"
    - git config user.email "gitlab-ci@homelab.local"
    - git config user.name "GitLab CI"
    - git remote set-url origin "http://gitlab-ci-token:${GITLAB_PUSH_TOKEN}@10.10.1.101/kujal/demo-nginx.git"
    - sed -i "s|image: $CI_REGISTRY_IMAGE/demo-nginx:.*|image: $CI_REGISTRY_IMAGE/demo-nginx:$IMAGE_TAG|g" k8s/deployment.yaml
    - echo "Verify image tag after replacement"
    - grep "image:" k8s/deployment.yaml
    - git add k8s/deployment.yaml
    - git diff --cached --stat
    - git diff --cached -- k8s/deployment.yaml | grep "^+" || true
    - >
      if git diff --cached --quiet; then
        echo "No changes to commit - image tag already up to date";
      else
        git commit -m "ci update image tag to $IMAGE_TAG [skip ci]";
        git push origin HEAD:main;
        echo "Pushed updated image tag to repo";
      fi
    - echo "Deploy triggered via ArgoCD GitOps sync"
  only:
    - main

verify:
  stage: verify
  script:
    - echo "Verifying ArgoCD sync"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG=~/.kube/config
    - sleep 30
    - kubectl get application demo-nginx -n argocd
    - kubectl get pods -n demo -o wide
    - kubectl get deployment demo-nginx -n demo
    - kubectl get pods -n demo -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\n"}{end}'
    - NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
    - NODE_PORT=$(kubectl get svc demo-nginx -n demo -o jsonpath='{.spec.ports[0].nodePort}')
    - echo "Testing http://$NODE_IP:$NODE_PORT"
    - HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://$NODE_IP:$NODE_PORT)
    - echo "HTTP response $HTTP_CODE"
    - test "$HTTP_CODE" = "200" || (echo "ERROR smoke test failed" && exit 1)
    - echo "Smoke test passed"
  only:
    - main