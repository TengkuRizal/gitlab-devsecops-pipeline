stages:
  - deploy

deploy-demo:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
  - mkdir -p ~/.kube
  - echo "$KUBECONFIG_B64" | wc -c          # Semak variable ada content
  - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
  - cat ~/.kube/config | head -5             # Semak output betul
  - kubectl get nodes